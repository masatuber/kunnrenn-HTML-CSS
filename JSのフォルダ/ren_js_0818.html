    <script>
      const random99=Math.random() * 100;

    const omikujiKirisute = Math.floor(random99);

    switch (true) {
      case (omikujiKirisute <= 4):
          console.log("おみくじの大吉です", omikujiKirisute);
          break;
      case (omikujiKirisute >= 5 && omikujiKirisute <= 19):
          console.log("おみくじの吉です", omikujiKirisute);
          break;
      case (omikujiKirisute >= 20 && omikujiKirisute <= 39):
          console.log("おみくじの中吉です", omikujiKirisute);
          break;
      case (omikujiKirisute >= 40 && omikujiKirisute <= 69):
          console.log("おみくじの小吉です", omikujiKirisute);
          break;
      case (omikujiKirisute >= 70 && omikujiKirisute <= 94):
          console.log("おみくじの末吉です", omikujiKirisute);
          break;
      case (omikujiKirisute >= 95 && omikujiKirisute <= 99):
          console.log("おみくじの凶です", omikujiKirisute);
          break;
      default:
        console.log("おみくじの範囲外の数値です", omikujiKirisute);
        break;
}

    </script>
