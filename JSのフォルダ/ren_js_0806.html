<body>
  <script>

// 初期値
    let num1 = 13;
//  あまりを求める計算
    let calculation1 = num1 % 2;
  
    if (calculation1 === 0 ) { // &&  guusuu === 0
      console.log("あまりなしで偶数で計算結果は", calculation1);
    } else {
      console.log("あまりありで奇数で計算結果は", calculation1);
    }

// うるう年
  let uruuYear = 1236;
    if (uruuYear % 400 === 0) {
      console.log("400で割切れるからうるう年 余りはない",);
    } else if (uruuYear % 100 === 0) {
      console.log("100で割切れるので平年 余りはない");
    } else if (uruuYear % 4 === 0 ) {
      console.log("4で割切れるのでうるう年");
    } else {
      console.log("それ以外のため平年");
    }

  </script>
