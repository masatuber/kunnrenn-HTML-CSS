  <title>おみくじ、カード1枚引いた時の練習（回答）</title>

<body>
    <script>
    let card = Math.floor(Math.random()*52);
    let mark, num;
    switch(Math.floor(card/13)) {
      case 0:
        mark = "スペード";
        break;
      case 1:
        mark = "ハート";
        break;
      case 2:
        mark = "クラブ";
      case 3:
        mark = "ダイヤ";
        break;

    }
    card++;
      num = card % 13;
      if (num == 0) {
        num=13;
      }
      console.log(mark+"の"+num);

    </script>
