<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathオブジェクト練習</title>
</head>
<body>
  <script>
    // 解説記事 https://qiita.com/Jochun/items/223f015342eec72b66fd
    console.log(Math.abs(-200)); // 絶対値に変換して200を出力
    console.log(Math.PI); // 演習率 大文字表記なので注意

    // 最小、最大を出力
    console.log(Math.max(2,5,1,7,3,9,2,9,4));
    console.log(Math.min(1,5,0,3,7,0,2));

// 最大値・最小値はその値のみを取得し「どこに」や「何個」は不明となる
  let ranNum=Math.random() * 100; // 0以上100未満で小数点以下まで残った状態の乱数取得
    console.log(ranNum);
    console.log("切り上げ", Math.ceil(ranNum));
    console.log("切り捨て", Math.floor(ranNum));
    console.log("四捨五入", Math.round(ranNum));

// 円周率を3.14として使いたい時の処理
    let enshu = Math.PI; // 円周率を取得（小数点以下第15位まで）
    enshu *= 100; // 3.14より下の桁を切り捨てるため、一旦314.159～の形にする
    enshu = Math.floor(enshu); // 切り捨てて314にする
    enshu/=100; // 100で割って桁を戻して3.14
    console.log(enshu);
//　切り上げ切り捨て、四捨五入を伴う計算での注意点
// posレジなどのように複数個の数値の演算を行う場合個々に切捨てなどの処理をするケースと
// 最後に1回切捨て等を行うケースでは、演算1回につき最大0.9999～のずれが生じる
// どちらで行うのかをシステム全体で統一する必要がある
  </script>
</body>
</html>
