<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フォームなど</title>
</head>
<body>
  <form action="" method="post" enctype="multipart/form-data">
    <p>名前：<input type="text" name="namae"></p>
    <p>パスワード：<input type="password" name="pass"></p>
    <p>好きな色：<input type="color" name="color"></p>
    <p>
      血液検査：<br>
      <input type="radio" name="blood" value="0">A型
      <input type="radio" name="blood" value="1">B型
      <input type="radio" name="blood" value="2">O型
      <input type="radio" name="blood" value="3">AB型
      <input type="radio" name="blood" value="4">その他
      <!-- 改行しないと半角スペース入らない、改行コードが挿入されるためスペースが入る -->
    </p>
    <p>
      趣味：<br>
      <input type="checkbox" name="fav[]" value="0">旅行
      <input type="checkbox" name="fav[]" value="1">音楽鑑賞
      <input type="checkbox" name="fav[]" value="2" checked >インターネット
      <input type="checkbox" name="fav[]" value="3">スポーツ
    </p>
    <p>
      メールアドレス：<input type="email" name="email" size="60">
    </p>
    <p>
      居住都道府県：
      <select name="ken">
        <option value="0">北海道</option>
        <optgroup label="東北">
          <option value="1" selected>青森</option>
          <option value="2">秋田</option>
        </optgroup>
      </select>
    </p>
    <P>
      <textarea name="qus" cols="60" rows="10" placeholder="お問合せ内容"></textarea>
    </P>
    <p>
      写真を選択してください：<input type="file" name="file">
    </p>
    <p>
      <input type="submit" value="登録">
      <input type="reset" value="入力内容消去">
      <input type="button" value="click">
      <p>
        <button type="button">JS用のボタン</button>
      </p>
      <!-- buttonで出したボタンはCSSで文字や背景などの変更が可能です -->
    </p>
  </form>
</body>
</html>
