<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カレンダーを表示したい</title>
</head>
<body>
    <p>
        年<input type="text" id="input_year">
        月<input type="text" id="input_moth">
    </p>
    <P>
        <input type="button" value="表示" id="input_calendar">
    </P>
  <table id="table1">
    
  </table>
  <script>
    let inputValues1 = "";
    let inputValues2 = "";

    const tableId = document.getElementById("table1");
    console.log("tableIdは", tableId);
    let days = 6;
    let day = 1 - days;
    let el = "";
    let dayCount = 0;

    el = `<caption>月</caption>` + "<tr><th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th></tr>";
    el += `<tr>`;

    for (let i = day; i <= 31; i++) {
// day（1 - days）から、31日までループを回すことで、1未満（0やマイナス）の期間ができる
        if (i < 1 || i > 31) {
        el += `<td>&nbsp;</td>`;
    } else {
        el += `<td>${i}</td>`;
    } 
    dayCount++;

// 7日ごとに改行する
    if (dayCount % 7 === 0 && i < 31 ) {
    el += `</tr><tr>`;
    }
    
  }
  el += `</tr>`;
  tableId.innerHTML = el;
  console.log(el)

 

// 年の値取得関数
  function inputChangeYear(e) {
    const getElCaption =  document.getElementsByTagName("caption");
    inputValues1 += e.currentTarget.value;
    console.log(e.currentTarget.value);

    getElCaption[0].insertAdjacentElement("afterbegin", inputValues1);
  }
// 年のエレメントを取得しクリックで発火
  const inputY =document.getElementById("input_year");
  inputY.addEventListener("input", inputChangeYear);

// 月の値取得の関数
    function inputChangeMoth(e) {
    const getElCaption =  document.getElementsByTagName("caption");
    console.log(e.currentTarget.value);
    inputValues2 += e.currentTarget.value;
    getElCaption[0].insertAdjacentHTML("afterbegin", inputValues2);
  }
//  月のエレメントを取得しクリックで発火
  const inputM = document.getElementById("input_moth");
  inputM.addEventListener("input", inputChangeMoth);

  </script>
</body>
</html>
