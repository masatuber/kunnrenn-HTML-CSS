<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>画像貼り付け方法</title>
    <link rel="stylesheet" href="./background_css_20260730.css">
    <link rel="icon" href="./images/verification_favicon.jpeg">
  </head>
  <body>
    <!-- サイズをしている場所ではない認識。そのためwrapperを用意して高さを設定 -->
    <div id="wrapper">
      <header>
        <h1>見出し</h1>
      </header>
      <main>
        <section class="background_test">
          <h2>見出し</h2>
        </section>
        <section class="table_test">
          <table>
            <caption>テーブルキャプション</caption>
            <thead>
              <tr>
                <th>見出し1</th>
                <th>見出し2</th>
                <th>見出し3</th>
                <th>見出し4</th>
              </tr> <!--表の場合、改行しない人もいる-->
            </thead>
            <tbody>
              <tr>
                <td colspan="2">1-1</td>
                <!-- <td>1-2</td> -->
                <td>1-3</td>
                <td>1-4</td>
              </tr>
              <tr>
                <td rowspan="2">2-1</td>
                <td>2-2</td>
                <td colspan="2" rowspan="2">2-3</td>
                <!-- <td>2-4</td> -->
              </tr>
              <tr>
                <!-- <td>3-1</td> -->
                <td>3-2</td>
                <!-- <td>3-3</td>
                <td>3-4</td> -->
              </tr>
            <!-- rowspanで縦のセルを連結すると、文字が縦中央に表示される。
            これは、thとtdのvertical-alignの初期値がmiddleとなっているため
            上や下に出したい時は、cssでvertical-alignの指定を行う -->
            </tbody>
            <tfoot>
              <tr><td>集計1</td><td>集計2</td><td>集計3</td><td>集計4</td></tr>
            </tfoot>
          </table>
        </section>
      </main>
    </div>
  </body>
</html>
