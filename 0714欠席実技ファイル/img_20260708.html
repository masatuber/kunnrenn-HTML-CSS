<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--レスポンシブデザイン対応-->
    <title>画像表示テスト</title>
</head>
<body>
  <h1>figucaption使用例</h1>
  <h2>参考図表であることを示す</h2>
  <figure>
  <img src="/images/flower.png" alt="梅の花">
  <figcaption>いらすとやの梅の花</figcaption>
  </figure>
  <h2>表（テーブル）にタイトルをつける</h2>
  <figure>
  <figcaption>表1：第1四半期の売上データ（単位：万円）</figcaption>
  <table>
    <tr>
      <th>月</th>
      <th>売上</th>
    </tr>
    <tr>
      <td>1月</td>
      <td>500</td>
    </tr>
    <tr>
      <td>2月</td>
      <td>600</td>
    </tr>
  </table>
  </figure>
  <hr>
  <h1>画像保存先も変更</h1>
  <h2>同フォルダ内</h2>
  <p>馬<img src="uma.png" alt="馬画像"></p>
  <h2>別フォルダ内＋横並び</h2>
  <p><img src="./images/penguin.png" alt="ペンギン"><img src="./images/lion.png" alt="ライオン">
  <h2>別フォルダ内<h2>
  <p><img src="./images/hukurou/hukuhuku (1).jpg" alt="フクロウ1" width="300px"><img src="./images/hukurou/hukuhuku (2).jpg" alt="フクロウ2" width="300px"><img src="./images/hukurou/hukuhuku (3).jpg" alt="フクロウ3" width="300px"></p>
  <h2>画像の中にリンクを貼る方法</h2>
  <ul>
    <li><a href="https://yahoo.co.jp"><img src="./images/tora.png" alt="トラの画像（yahoo）"></a></li>
    <li><a href="https:google.com" rel="noopener noreferrer" target="_blank"><img src="./images/inu.png" alt="犬の画像（google）" width="200px"></a></li>
    <!-- サイズ変更は、HTMLタグの属性として直接書く方法がある。
    横幅をwidth属性で指定し、高さは指定しないのが一般的
    横幅のみを指定すると、高さは元画像の縦横比を保った形で自動調整される
    対象となるタグの中にwidth=数値+単位（なんの単位か明確にするため）を記載するとよい。 -->
  </ul>
  <hr>
  <h1>figure利用方法</h1>
  <figure>
    <img src="./images/hukurou/hukuhuku (2).jpg" alt="アンティークフクロウ">
    <figcaption>アンティークのフクロウです。</figcaption>
    <!--
    figcaptionとaltは別用途なので、同じ文章でも両方必要。
    figureが初期値としてインデントすることを持っている。 
    -->
  </figure>
  <!-- 注意！画像にリンクを貼っている場合、マウスカーソルを持っていくと矢印から指先に自動変更されるため、画像をクリックしたらJavaScriptを起動させることを表すためにaタグで操作することがあるが、これはルール違反（サイトの評価が下がる） -->
</body>
</html>
