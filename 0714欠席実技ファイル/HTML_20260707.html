<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>見出し表示例</title>
</head>
<body>
    <h1>見出し1</h1>
    <h2>見出し2</h2>
    <h3>見出し3</h3>
    <h4>見出し4</h4>
    <h5>見出し5</h5>
    <h6>見出し6</h6>
    <p>テキスト1</p>
    <p>テキストテキストテキスト<br>テキスト</p>
    <p>テキストテキストテキスト
        tekisto
    </p>
    <!-- 上記のようにソースを見やすくするために文中に開業を入れてしまうと、ブラウザの表示の際に改行コードが半角スペースとして表示されてしまう。 -->
     <hr>
     <p>線は見えたかな?</p>
</body>
</html>
