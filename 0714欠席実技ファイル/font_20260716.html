<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--レスポンシブデザイン対応-->
  <title>Webフォント検証</title>
  <link rel="stylesheet" href="./font_css_20260716.css">
  <link rel="icon" href="./images/verification_favicon.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bpmf+Zihi+Kai+Std&family=Dela+Gothic+One&family=LINE+Seed+JP&family=M+PLUS+1p&family=Zen+Kaku+Gothic+New&display=swap" rel="stylesheet">

  <!-- googleフォント画面でフォントを選ぶ場合、HTMLファイルとCSSファイルに貼り付けるコードはセットとして考える。
  フォントを複数貼り付ける場合、HTMLファイルに貼り付けるリンク先が変わる可能性もあるため、反映がうまくいかない場合は、見た目が同じでもそれぞれのリンクを再度貼りなおすことが有効。-->
  <!-- うまく画面が反映しない場合は、ブラウザのデベロッパーツール(開発F12)からどのコードを見に行っているか、先を確認すること -->

  </head>
<body>
  <h1>Webフォント「Zen Kaku Gothic New」あああ</h1>
  <h2>Webフォント「Dela Gothic One」あああ</h2>
  <hr>
  <h2>フォントの表し方</h2>
  <h3>justifyの均等割り当て確認</h3>
  <p class="caps">ABCabc</p>
  <!-- p class=capsとして設定した文字に対して指定していく -->
  <p>line-heightを利用するため<br>
    ブラウザを通して確認します</p>
  <!-- 初期値は、大体1.5ほどとられている -->
</body>
</html>
